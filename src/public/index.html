<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>티켓팅 시스템</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }

    .header { background: #1e293b; border-bottom: 1px solid #334155; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 20px; color: #38bdf8; }
    .header .health { display: flex; gap: 8px; align-items: center; }
    .health-dot { width: 10px; height: 10px; border-radius: 50%; }
    .health-dot.ok { background: #22c55e; }
    .health-dot.fail { background: #ef4444; }
    .health-dot.unknown { background: #64748b; }
    .health-label { font-size: 12px; color: #94a3b8; }

    .container { max-width: 960px; margin: 0 auto; padding: 24px; }

    .flow-steps { display: flex; gap: 4px; margin-bottom: 24px; align-items: center; }
    .step { padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; background: #1e293b; color: #64748b; border: 1px solid #334155; cursor: default; }
    .step.active { background: #0ea5e9; color: #fff; border-color: #0ea5e9; }
    .step.done { background: #1e293b; color: #22c55e; border-color: #22c55e; }
    .step-arrow { color: #475569; font-size: 18px; }

    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 24px; margin-bottom: 20px; }
    .card h2 { font-size: 16px; color: #38bdf8; margin-bottom: 16px; }

    .event-info { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    .event-info div { padding: 12px; background: #0f172a; border-radius: 8px; }
    .event-info label { font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 1px; }
    .event-info p { font-size: 15px; color: #e2e8f0; margin-top: 4px; }

    .seat-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; margin-bottom: 20px; }
    .seat { width: 100%; aspect-ratio: 1; border-radius: 6px; border: none; cursor: pointer; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
    .seat.available { background: #334155; color: #94a3b8; }
    .seat.available:hover { background: #0ea5e9; color: #fff; transform: scale(1.1); }
    .seat.selected { background: #0ea5e9; color: #fff; box-shadow: 0 0 12px rgba(14,165,233,0.4); }
    .seat.booked { background: #1e293b; color: #475569; cursor: not-allowed; }
    .seat.held { background: #f59e0b; color: #000; }

    .legend { display: flex; gap: 16px; margin-bottom: 16px; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #94a3b8; }
    .legend-color { width: 14px; height: 14px; border-radius: 4px; }

    .btn { padding: 10px 20px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary { background: #0ea5e9; color: #fff; }
    .btn-primary:hover:not(:disabled) { background: #0284c7; }
    .btn-confirm { background: #22c55e; color: #fff; }
    .btn-confirm:hover:not(:disabled) { background: #16a34a; }
    .btn-secondary { background: #334155; color: #e2e8f0; }
    .btn-secondary:hover:not(:disabled) { background: #475569; }

    .actions { display: flex; gap: 12px; align-items: center; }

    .log-panel { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 16px; max-height: 240px; overflow-y: auto; font-family: 'Cascadia Code', 'Fira Code', monospace; font-size: 12px; line-height: 1.8; }
    .log-entry { padding: 2px 0; border-bottom: 1px solid #1e293b; }
    .log-time { color: #64748b; }
    .log-method { font-weight: 700; }
    .log-method.get { color: #22c55e; }
    .log-method.post { color: #f59e0b; }
    .log-status { font-weight: 700; }
    .log-status.s2xx { color: #22c55e; }
    .log-status.s4xx { color: #f59e0b; }
    .log-status.s5xx { color: #ef4444; }

    .result-box { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 16px; margin-top: 12px; }
    .result-box pre { font-family: 'Cascadia Code', monospace; font-size: 12px; color: #38bdf8; white-space: pre-wrap; }

    .info-bar { display: flex; gap: 12px; margin-bottom: 20px; }
    .info-chip { padding: 6px 12px; background: #0f172a; border: 1px solid #334155; border-radius: 20px; font-size: 12px; color: #94a3b8; }
    .info-chip strong { color: #e2e8f0; }

    .screen { width: 60%; margin: 0 auto 20px; padding: 6px; background: linear-gradient(to bottom, #475569, #334155); border-radius: 4px; text-align: center; font-size: 11px; color: #94a3b8; letter-spacing: 4px; }

    input[type="text"] { background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 8px 12px; color: #e2e8f0; font-size: 13px; width: 200px; }
    input[type="text"]:focus { outline: none; border-color: #0ea5e9; }

    .status-badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; }
    .status-badge.pending { background: #f59e0b20; color: #f59e0b; }
    .status-badge.confirmed { background: #22c55e20; color: #22c55e; }
    .status-badge.failed { background: #ef444420; color: #ef4444; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🎫 티켓팅 시스템 Demo</h1>
    <div class="health">
      <div class="health-dot unknown" id="healthDot"></div>
      <span class="health-label" id="healthLabel">checking...</span>
    </div>
  </div>

  <div class="container">
    <!-- Flow Steps -->
    <div class="flow-steps" id="flowSteps">
      <div class="step active" data-step="1">① 좌석 조회</div>
      <span class="step-arrow">→</span>
      <div class="step" data-step="2">② 좌석 Hold</div>
      <span class="step-arrow">→</span>
      <div class="step" data-step="3">③ 예매 확정</div>
      <span class="step-arrow">→</span>
      <div class="step" data-step="4">④ 결과 확인</div>
    </div>

    <!-- Event Info -->
    <div class="card">
      <h2>공연 정보</h2>
      <div class="event-info">
        <div><label>공연명</label><p id="eventName">2026 연말 콘서트</p></div>
        <div><label>일시</label><p>2026-12-31 19:00</p></div>
        <div><label>장소</label><p>올림픽홀</p></div>
        <div><label>Event ID</label><p id="eventIdDisplay">1</p></div>
      </div>
      <div class="info-bar">
        <div class="info-chip">Event ID: <strong><input type="text" id="eventIdInput" value="1" style="width:60px;"></strong></div>
        <button class="btn btn-primary" onclick="loadSeats()">좌석 조회</button>
      </div>
    </div>

    <!-- Seat Map -->
    <div class="card" id="seatCard" style="display:none;">
      <h2>좌석 선택</h2>
      <div class="screen">STAGE</div>
      <div class="legend">
        <div class="legend-item"><div class="legend-color" style="background:#334155;"></div> 선택 가능</div>
        <div class="legend-item"><div class="legend-color" style="background:#0ea5e9;"></div> 내가 선택</div>
        <div class="legend-item"><div class="legend-color" style="background:#f59e0b;"></div> Hold 중</div>
        <div class="legend-item"><div class="legend-color" style="background:#1e293b;"></div> 예매 완료</div>
      </div>
      <div class="seat-grid" id="seatGrid"></div>
      <div class="actions">
        <button class="btn btn-primary" id="holdBtn" onclick="holdSeat()" disabled>좌석 Hold</button>
        <span id="selectedInfo" style="font-size:13px; color:#94a3b8;"></span>
      </div>
    </div>

    <!-- Hold Result & Booking -->
    <div class="card" id="bookingCard" style="display:none;">
      <h2>예매 확정</h2>
      <div class="info-bar">
        <div class="info-chip">좌석: <strong id="heldSeatNo">-</strong></div>
        <div class="info-chip">Hold 만료: <strong id="holdExpiry">-</strong></div>
        <div class="info-chip">Hold ID: <strong id="holdId">-</strong></div>
      </div>
      <div class="actions">
        <button class="btn btn-confirm" onclick="createBooking()">예매 확정</button>
        <button class="btn btn-secondary" onclick="cancelHold()">Hold 취소</button>
      </div>
    </div>

    <!-- Result -->
    <div class="card" id="resultCard" style="display:none;">
      <h2>예매 결과</h2>
      <div id="resultContent"></div>
    </div>

    <!-- API Log -->
    <div class="card">
      <h2>API 통신 로그</h2>
      <div class="log-panel" id="logPanel">
        <div class="log-entry"><span class="log-time">--:--:--</span> 대기 중...</div>
      </div>
    </div>
  </div>

  <script>
    // === 상태 ===
    const API = '';  // 같은 origin이면 빈 문자열
    let selectedSeatId = null;
    let currentHold = null;
    let currentBooking = null;

    // === 헬스체크 ===
    async function checkHealth() {
      const dot = document.getElementById('healthDot');
      const label = document.getElementById('healthLabel');
      try {
        const res = await fetch(`${API}/health/ready`);
        const data = await res.json();
        if (res.ok) {
          dot.className = 'health-dot ok';
          label.textContent = 'All Systems OK';
        } else {
          dot.className = 'health-dot fail';
          label.textContent = Object.entries(data).filter(([k,v]) => v !== 'ok').map(([k]) => k).join(', ') + ' 연결 실패';
        }
      } catch (e) {
        // /health/ready 없으면 /healthz fallback
        try {
          const res2 = await fetch(`${API}/healthz`);
          if (res2.ok) {
            dot.className = 'health-dot ok';
            label.textContent = 'Server OK (basic)';
          }
        } catch (e2) {
          dot.className = 'health-dot fail';
          label.textContent = 'Server 연결 실패';
        }
      }
    }

    // === 로그 ===
    function addLog(method, path, status, detail) {
      const panel = document.getElementById('logPanel');
      const now = new Date().toTimeString().slice(0, 8);
      const methodClass = method === 'GET' ? 'get' : 'post';
      const statusClass = status < 300 ? 's2xx' : status < 500 ? 's4xx' : 's5xx';
      const entry = document.createElement('div');
      entry.className = 'log-entry';
      entry.innerHTML = `<span class="log-time">${now}</span> <span class="log-method ${methodClass}">${method}</span> ${path} → <span class="log-status ${statusClass}">${status}</span> ${detail || ''}`;
      panel.prepend(entry);
    }

    // === Flow Step 업데이트 ===
    function setStep(num) {
      document.querySelectorAll('.step').forEach(s => {
        const n = parseInt(s.dataset.step);
        s.className = 'step' + (n === num ? ' active' : n < num ? ' done' : '');
      });
    }

    // === ① 좌석 조회 ===
    async function loadSeats() {
      const eventId = document.getElementById('eventIdInput').value || '1';
      try {
        const res = await fetch(`${API}/events/${eventId}/seats`);
        const data = await res.json();
        addLog('GET', `/events/${eventId}/seats`, res.status, `${Array.isArray(data) ? data.length : data.seats?.length || 0}석`);

        if (!res.ok) {
          addLog('GET', `/events/${eventId}/seats`, res.status, data.error || 'error');
          return;
        }

        const seats = Array.isArray(data) ? data : data.seats || [];
        renderSeats(seats);
        document.getElementById('seatCard').style.display = 'block';
        setStep(1);
      } catch (e) {
        addLog('GET', `/events/${eventId}/seats`, 0, e.message);
      }
    }

    function renderSeats(seats) {
      const grid = document.getElementById('seatGrid');
      grid.innerHTML = '';
      seats.forEach(seat => {
        const btn = document.createElement('button');
        const status = (seat.status || 'AVAILABLE').toUpperCase();
        let cls = 'available';
        if (status === 'BOOKED') cls = 'booked';
        else if (status === 'HELD' || status === 'HOLD') cls = 'held';

        btn.className = `seat ${cls}`;
        btn.textContent = seat.seat_no || seat.seatNo || seat.id;
        btn.disabled = status !== 'AVAILABLE';

        if (status === 'AVAILABLE') {
          btn.onclick = () => selectSeat(seat, btn);
        }
        grid.appendChild(btn);
      });
    }

    function selectSeat(seat, btn) {
      document.querySelectorAll('.seat.selected').forEach(s => {
        if (s !== btn) s.className = 'seat available';
      });
      btn.className = 'seat selected';
      selectedSeatId = seat.id || seat.seat_id;
      document.getElementById('holdBtn').disabled = false;
      document.getElementById('selectedInfo').textContent = `선택: ${seat.seat_no || seat.seatNo} (ID: ${selectedSeatId})`;
    }

    // === ② 좌석 Hold ===
    async function holdSeat() {
      if (!selectedSeatId) return;
      try {
        const res = await fetch(`${API}/seats/${selectedSeatId}/hold`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
        });
        const data = await res.json();
        addLog('POST', `/seats/${selectedSeatId}/hold`, res.status, data.holdId ? `holdId=${data.holdId}` : (data.error || ''));

        if (res.ok) {
          currentHold = { seatId: selectedSeatId, ...data };
          document.getElementById('heldSeatNo').textContent = selectedSeatId;
          document.getElementById('holdExpiry').textContent = data.expiresAt || data.expires_at || '-';
          document.getElementById('holdId').textContent = data.holdId || data.hold_id || '-';
          document.getElementById('bookingCard').style.display = 'block';
          setStep(2);
        }
      } catch (e) {
        addLog('POST', `/seats/${selectedSeatId}/hold`, 0, e.message);
      }
    }

    // === ③ 예매 확정 ===
    async function createBooking() {
      if (!currentHold) return;
      const idempotencyKey = `booking-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
      const eventId = document.getElementById('eventIdInput').value || '1';
      try {
        const res = await fetch(`${API}/bookings`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Idempotency-Key': idempotencyKey,
          },
          body: JSON.stringify({
            eventId: parseInt(eventId),
            seatId: parseInt(currentHold.seatId),
          }),
        });
        const data = await res.json();
        addLog('POST', `/bookings`, res.status, data.bookingId ? `bookingId=${data.bookingId}` : (data.error || ''));

        if (res.ok) {
          currentBooking = data;
          showResult(data);
          setStep(3);
          // 잠시 후 결과 조회
          setTimeout(() => queryBooking(data.bookingId || data.booking_id), 2000);
        } else {
          showResult(data);
        }
      } catch (e) {
        addLog('POST', `/bookings`, 0, e.message);
      }
    }

    // === ④ 결과 확인 ===
    async function queryBooking(bookingId) {
      if (!bookingId) return;
      try {
        const res = await fetch(`${API}/bookings/${bookingId}`);
        const data = await res.json();
        addLog('GET', `/bookings/${bookingId}`, res.status);

        const res2 = await fetch(`${API}/payments/${bookingId}`);
        const payData = await res2.json();
        addLog('GET', `/payments/${bookingId}`, res2.status);

        showResult({ booking: data, payment: payData });
        setStep(4);
      } catch (e) {
        addLog('GET', `/bookings/${bookingId}`, 0, e.message);
      }
    }

    function showResult(data) {
      const card = document.getElementById('resultCard');
      const content = document.getElementById('resultContent');
      card.style.display = 'block';

      let status = data.status || data.booking?.status || 'UNKNOWN';
      let badgeClass = status === 'CONFIRMED' ? 'confirmed' : status === 'FAILED' ? 'failed' : 'pending';

      content.innerHTML = `
        <div style="margin-bottom:12px;">
          상태: <span class="status-badge ${badgeClass}">${status}</span>
        </div>
        <div class="result-box"><pre>${JSON.stringify(data, null, 2)}</pre></div>
      `;
    }

    function cancelHold() {
      currentHold = null;
      selectedSeatId = null;
      document.getElementById('bookingCard').style.display = 'none';
      document.getElementById('holdBtn').disabled = true;
      document.getElementById('selectedInfo').textContent = '';
      document.querySelectorAll('.seat.selected').forEach(s => s.className = 'seat available');
      setStep(1);
      addLog('INFO', 'Hold 취소', '-', 'client reset');
    }

    // === 초기화 ===
    checkHealth();
    setInterval(checkHealth, 30000);
  </script>
</body>
</html>
