<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>로그인 | Ticket Rail</title>
  <style>
    :root{--blue:#173d72;--blue2:#0b5fa8;--green:#0f8f6f;--ink:#202936;--muted:#667085;--line:#dfe4ea;--bg:#f5f7fa}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Pretendard,"Noto Sans KR","Malgun Gothic",Arial,sans-serif;color:var(--ink);background:#fff}button,input{font:inherit}
    .topline{height:4px;background:linear-gradient(90deg,var(--blue),var(--blue2) 60%,var(--green))}
    header{border-bottom:1px solid #e8ebef;background:#fff}.header-inner{max-width:1180px;height:82px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:0 24px}
    .brand{display:flex;align-items:center;gap:12px;color:var(--blue);text-decoration:none;font-weight:900;letter-spacing:-.03em}.brand-mark{display:grid;place-items:center;width:44px;height:44px;border-radius:50% 50% 48% 52%;background:linear-gradient(145deg,var(--blue2),var(--green));color:#fff;font-size:22px;font-style:italic}.brand-text{font-size:24px}.brand-text small{display:block;margin-top:2px;color:#758195;font-size:10px;font-weight:700;letter-spacing:.15em}
    nav{display:flex;gap:34px}nav a{color:#384250;text-decoration:none;font-size:15px;font-weight:700}nav a.active{color:var(--blue2)}
    .utility{display:flex;gap:15px;color:#727d8d;font-size:12px}.utility a{color:inherit;text-decoration:none}
    .breadcrumb-wrap{border-bottom:1px solid #edf0f3;background:#fafbfc}.breadcrumb{max-width:1180px;height:48px;margin:auto;display:flex;align-items:center;gap:8px;padding:0 24px;color:#7b8492;font-size:12px}.home{color:var(--blue2)}
    main{min-height:650px;padding:58px 24px 86px;background:linear-gradient(#fff 0,#fff 65%,#fafbfd 100%)}.content{max-width:860px;margin:auto}.page-title{margin:0 0 42px;text-align:center;font-size:36px;letter-spacing:-.045em}.page-title:after{content:"";display:block;width:38px;height:3px;margin:15px auto 0;background:var(--blue2)}
    .login-box{max-width:680px;margin:auto;border:1px solid #dfe4e9;border-radius:3px;background:#fff;box-shadow:0 10px 28px #1d38500d}.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}.tab{height:58px;border:0;border-right:1px solid var(--line);background:#f7f8fa;color:#687383;font-size:14px;font-weight:700;cursor:pointer}.tab:last-child{border-right:0}.tab.active{position:relative;background:#fff;color:var(--blue2)}.tab.active:before{content:"";position:absolute;left:-1px;right:-1px;top:-1px;height:3px;background:var(--blue2)}
    .panel{padding:42px 74px 36px}.member-title{margin:0;font-size:22px;letter-spacing:-.03em}.member-sub{margin:8px 0 27px;color:var(--muted);font-size:14px}.field{position:relative;margin-bottom:12px}.field input{width:100%;height:54px;padding:0 16px;border:1px solid #cfd5dc;border-radius:2px;color:#26313f;outline:none}.field input:focus{border-color:var(--blue2);box-shadow:0 0 0 3px #0b5fa811}.field input::placeholder{color:#9aa2ad}
    .options{display:flex;align-items:center;justify-content:space-between;margin:15px 0 21px;color:#697483;font-size:13px}.remember{display:flex;align-items:center;gap:7px;cursor:pointer}.remember input{width:16px;height:16px;accent-color:var(--blue2)}.warning{color:#7c8796}.login-button{width:100%;height:56px;border:0;border-radius:2px;background:var(--blue2);color:#fff;font-size:16px;font-weight:800;cursor:pointer;transition:.15s}.login-button:hover{background:var(--blue)}
    .message{min-height:20px;margin:12px 0 0;text-align:center;font-size:13px;font-weight:700;color:#c43232}.message.success{color:var(--green)}
    .account-links{display:flex;justify-content:center;margin:25px 0 0;padding-top:24px;border-top:1px solid #edf0f3}.account-links a{padding:0 17px;border-right:1px solid #d9dde2;color:#4e5968;text-decoration:none;font-size:13px}.account-links a:last-child{border:0}
    .service-links{max-width:680px;margin:20px auto 0;display:grid;grid-template-columns:1fr 1fr;gap:10px}.service{display:flex;align-items:center;justify-content:space-between;padding:17px 20px;border:1px solid #e2e6ea;background:#fff;color:#354052;text-decoration:none;font-size:14px;font-weight:700}.service span:last-child{color:var(--blue2);font-size:18px}
    footer{border-top:1px solid #e3e7eb;background:#f8f9fb}.footer-inner{max-width:1180px;margin:auto;padding:27px 24px 34px;color:#7d8794;font-size:12px}.footer-links{display:flex;flex-wrap:wrap;gap:8px 19px;margin-bottom:15px}.footer-links a{color:#606b79;text-decoration:none}.copyright{color:#9aa1ab}
    @media(max-width:760px){nav,.utility{display:none}.header-inner{height:70px}.brand-text{font-size:21px}main{padding:40px 15px 65px}.page-title{font-size:30px;margin-bottom:30px}.tabs{grid-template-columns:1fr 1fr}.tab:nth-child(2){border-right:0}.tab:nth-child(-n+2){border-bottom:1px solid var(--line)}.panel{padding:34px 24px 28px}.service-links{grid-template-columns:1fr}.warning{display:none}}
  </style>
</head>
<body>
  <div class="topline"></div>
  <header>
    <div class="header-inner">
      <a class="brand" href="/login.html"><span class="brand-mark">T</span><span class="brand-text">TICKET RAIL<small>RAILWAY RESERVATION</small></span></a>
      <nav aria-label="주요 메뉴">
        <a class="active" href="#">승차권</a><a href="#">여행상품</a><a href="#">이용안내</a><a href="#">고객센터</a>
      </nav>
      <div class="utility"><a href="/login.html">로그인</a><a href="#">회원가입</a></div>
    </div>
  </header>
  <div class="breadcrumb-wrap"><div class="breadcrumb"><span class="home">홈</span><span>›</span><span>로그인</span></div></div>
  <main>
    <div class="content">
      <h1 class="page-title">로그인</h1>
      <section class="login-box" aria-label="회원 로그인">
        <div class="tabs" role="tablist">
          <button class="tab active" type="button" data-mode="회원번호" data-placeholder="회원번호를 입력하세요">회원번호</button>
          <button class="tab" type="button" data-mode="이메일 주소" data-placeholder="이메일 주소를 입력하세요">이메일 주소</button>
          <button class="tab" type="button" data-mode="휴대폰 번호" data-placeholder="휴대폰 번호를 입력하세요">휴대폰 번호</button>
          <button class="tab" type="button" data-mode="비회원 예매" data-placeholder="예매 고객명을 입력하세요">비회원 예매</button>
        </div>
        <div class="panel">
          <h2 class="member-title">철도회원</h2>
          <p class="member-sub" id="modeGuide">회원번호로 로그인하세요.</p>
          <form id="loginForm" novalidate>
            <div class="field"><input id="memberId" autocomplete="username" placeholder="회원번호를 입력하세요" aria-label="회원번호"></div>
            <div class="field"><input id="password" type="password" autocomplete="current-password" placeholder="비밀번호를 입력하세요" aria-label="비밀번호"></div>
            <div class="options">
              <label class="remember"><input type="checkbox" id="rememberId">회원번호 저장</label>
              <span class="warning">로그인 5회 실패 시 로그인이 제한됩니다.</span>
            </div>
            <button class="login-button" type="submit">로그인</button>
            <p class="message" id="message" role="status" aria-live="polite"></p>
          </form>
          <div class="account-links"><a href="#">회원번호 찾기</a><a href="#">비밀번호 찾기</a><a href="#">회원가입</a></div>
        </div>
      </section>
      <div class="service-links">
        <a class="service" href="#"><span>비회원 승차권 조회</span><span>›</span></a>
        <a class="service" href="#"><span>승차권 이용 안내</span><span>›</span></a>
      </div>
    </div>
  </main>
  <footer>
    <div class="footer-inner">
      <div class="footer-links"><a href="#">이용약관</a><a href="#">여객운송약관</a><a href="#">개인정보처리방침</a><a href="#">이메일무단수집거부</a><a href="#">고객센터</a></div>
      <div class="copyright">Copyright © TICKET RAIL. All rights reserved.</div>
    </div>
  </footer>
  <script>
    (function(){
      var account={id:'20260916',password:'demo1234'};
      var form=document.getElementById('loginForm');
      var memberId=document.getElementById('memberId');
      var password=document.getElementById('password');
      var remember=document.getElementById('rememberId');
      var message=document.getElementById('message');
      var guide=document.getElementById('modeGuide');
      var saved=localStorage.getItem('ticketing_saved_member');
      if(saved){memberId.value=saved;remember.checked=true}
      document.querySelectorAll('.tab').forEach(function(tab){
        tab.addEventListener('click',function(){
          document.querySelectorAll('.tab').forEach(function(item){item.classList.remove('active')});
          tab.classList.add('active');
          guide.textContent=tab.dataset.mode+'로 로그인하세요.';
          memberId.placeholder=tab.dataset.placeholder;
          memberId.setAttribute('aria-label',tab.dataset.mode);
          message.textContent='';
        })
      });
      form.addEventListener('submit',function(event){
        event.preventDefault();
        message.className='message';
        if(!memberId.value.trim()||!password.value){message.textContent='회원정보를 모두 입력해 주세요.';return}
        if(memberId.value.trim()!==account.id||password.value!==account.password){message.textContent='회원번호 또는 비밀번호를 확인해 주세요.';return}
        if(remember.checked){localStorage.setItem('ticketing_saved_member',memberId.value.trim())}else{localStorage.removeItem('ticketing_saved_member')}
        sessionStorage.setItem('ticketing_demo_login','true');
        sessionStorage.setItem('ticketing_member_id',memberId.value.trim());
        message.className='message success';
        message.textContent='로그인되었습니다.';
        setTimeout(function(){
          location.assign(location.protocol==='file:'?'ticketing.html':'/ticketing.html')
        },450)
      })
    }());
  </script>
</body>
</html>
