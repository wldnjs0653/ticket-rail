---
- name: Build and export all ticketing images on the Ansible Controller
  hosts: localhost
  connection: local
  become: true
  gather_facts: false

  vars_files:
    - vars/main.yml

  tasks:
    - name: Create the Controller image archive directory
      ansible.builtin.file:
        path: "{{ image_archive_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Build the four OCI images
      ansible.builtin.command:
        argv:
          - podman
          - build
          - --pull=missing
          - --tag
          - "{{ item.image }}"
          - "{{ item.context }}"
      loop: "{{ ticketing_images }}"
      loop_control:
        label: "{{ item.image }}"
      changed_when: true

    - name: Remove previous image archives
      ansible.builtin.file:
        path: "{{ item.archive }}"
        state: absent
      loop: "{{ ticketing_images }}"
      loop_control:
        label: "{{ item.archive }}"

    - name: Export the four images as OCI archives
      ansible.builtin.command:
        argv:
          - podman
          - save
          - --format
          - oci-archive
          - --output
          - "{{ item.archive }}"
          - "{{ item.image }}"
      loop: "{{ ticketing_images }}"
      loop_control:
        label: "{{ item.image }}"
      changed_when: true

    - name: Verify the exported image archives
      ansible.builtin.stat:
        path: "{{ item.archive }}"
      loop: "{{ ticketing_images }}"
      register: image_archives

    - name: Require all image archives to be nonempty
      ansible.builtin.assert:
        that:
          - image_archives.results | map(attribute='stat.exists') | min
          - image_archives.results | map(attribute='stat.size') | min > 0
        fail_msg: "One or more OCI image archives were not created."

