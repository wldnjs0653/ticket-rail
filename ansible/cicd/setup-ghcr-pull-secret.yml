---
- name: Configure private GHCR image pull authentication
  hosts: localhost
  connection: local
  gather_facts: false

  vars_prompt:
    - name: ghcr_pull_token
      prompt: "GHCR read-only token 입력"
      private: true
      confirm: true

  vars:
    ansible_python_interpreter: /opt/ticket-rail-venv/bin/python
    controller_kubeconfig: /root/.kube/config

    deploy_namespace: app
    ghcr_username: "{{ lookup('env', 'GHCR_USERNAME') | default('', true) }}"
    pull_secret_name: ghcr-pull-secret

  tasks:
    - name: Validate that a token was entered
      ansible.builtin.assert:
        that:
          - ghcr_pull_token | length > 20
          - ghcr_username | length > 0
        fail_msg: GHCR_USERNAME 환경 변수와 유효한 읽기 전용 토큰을 확인하세요.
      no_log: true

    - name: Build the Docker registry authentication document
      ansible.builtin.set_fact:
        ghcr_docker_config: >-
          {{
            {
              'auths': {
                'ghcr.io': {
                  'username': ghcr_username,
                  'password': ghcr_pull_token,
                  'auth': (ghcr_username ~ ':' ~ ghcr_pull_token) | b64encode
                }
              }
            } | to_json
          }}
      no_log: true

    - name: Create or update the GHCR image pull Secret
      kubernetes.core.k8s:
        kubeconfig: "{{ controller_kubeconfig }}"
        state: present
        apply: true
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ pull_secret_name }}"
            namespace: "{{ deploy_namespace }}"
            labels:
              app.kubernetes.io/part-of: ticketing-platform
              app.kubernetes.io/managed-by: ansible
          type: kubernetes.io/dockerconfigjson
          stringData:
            .dockerconfigjson: "{{ ghcr_docker_config }}"
      no_log: true

    - name: Read the created GHCR Secret
      kubernetes.core.k8s_info:
        kubeconfig: "{{ controller_kubeconfig }}"
        api_version: v1
        kind: Secret
        namespace: "{{ deploy_namespace }}"
        name: "{{ pull_secret_name }}"
      register: ghcr_secret
      no_log: true

    - name: Verify the GHCR Secret structure
      ansible.builtin.assert:
        that:
          - ghcr_secret.resources | length == 1
          - ghcr_secret.resources[0].type == "kubernetes.io/dockerconfigjson"
          - "'.dockerconfigjson' in ghcr_secret.resources[0].data"
        fail_msg: GHCR Pull Secret 생성 결과가 올바르지 않습니다.
        success_msg: GHCR Pull Secret이 정상적으로 구성되었습니다.
      no_log: true

    - name: Print the safe configuration result
      ansible.builtin.debug:
        msg:
          - "Secret: app/ghcr-pull-secret"
          - "Type: kubernetes.io/dockerconfigjson"
          - "The token value was not printed or saved in the playbook."
