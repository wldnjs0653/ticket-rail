---
- name: Kubernetes node prerequisites
  hosts: k8s
  become: true
  gather_facts: true

  tasks:

    - name: Load overlay module
      ansible.builtin.command:
        cmd: modprobe overlay
      changed_when: false

    - name: Load br_netfilter module
      ansible.builtin.command:
        cmd: modprobe br_netfilter
      changed_when: false

    - name: Persist Kubernetes kernel modules
      ansible.builtin.copy:
        dest: /etc/modules-load.d/kubernetes.conf
        mode: "0644"
        content: |
          overlay
          br_netfilter

    - name: Configure Kubernetes networking sysctl
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-kubernetes.conf
        mode: "0644"
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1

    - name: Apply sysctl settings
      ansible.builtin.command:
        cmd: sysctl --system
      changed_when: false

    - name: Verify IP forwarding
      ansible.builtin.command:
        cmd: sysctl -n net.ipv4.ip_forward
      register: ip_forward
      changed_when: false

    - name: Show IP forwarding
      ansible.builtin.debug:
        msg: "net.ipv4.ip_forward = {{ ip_forward.stdout }}"

    - name: Disable firewalld
      ansible.builtin.systemd:
        name: firewalld
        enabled: false
        state: stopped
