---
- name: Prepare Kubernetes control plane join information
  hosts: master1
  become: true
  gather_facts: false

  tasks:

    - name: Generate certificate key
      ansible.builtin.command:
        cmd: kubeadm init phase upload-certs --upload-certs
      register: certificate_key_result
      changed_when: false

    - name: Extract certificate key
      ansible.builtin.set_fact:
        certificate_key: "{{ certificate_key_result.stdout_lines[-1] }}"

    - name: Generate control plane join command
      ansible.builtin.command:
        cmd: kubeadm token create --print-join-command
      register: join_command_result
      changed_when: false

    - name: Save join command
      ansible.builtin.set_fact:
        join_command: "{{ join_command_result.stdout }}"


- name: Join additional control planes
  hosts: masters
  become: true
  gather_facts: false

  tasks:

    - name: Check whether control plane is already joined
      ansible.builtin.stat:
        path: /etc/kubernetes/kubelet.conf
      register: kubelet_config

    - name: Join control plane
      ansible.builtin.command:
        cmd: >
          {{ hostvars['master1']['join_command'] }}
          --control-plane
          --certificate-key {{ hostvars['master1']['certificate_key'] }}
      when:
        - inventory_hostname != 'master1'
        - not kubelet_config.stat.exists
