<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>예매 처리 기록 | TicketRail</title>
  <link rel="stylesheet" href="booking-trace.css">
  <script src="booking-trace.js" defer></script>
</head>
<body>
  <main class="page">
    <nav class="navigation" aria-label="TicketRail">
      <strong>TicketRail</strong>
      <a href="ticketing.html">← 예매 화면으로</a>
    </nav>
    <header class="heading">
      <div>
        <h1>예매 처리 기록</h1>
        <p id="seat">예매 중 기록된 처리 시각을 확인합니다.</p>
      </div>
      <p id="booking" class="booking" hidden></p>
    </header>
    <section class="record" aria-label="시스템 처리 기록">
      <ol id="stages" class="stages"></ol>
      <div class="status-row">
        <p id="status" class="status" role="status">처리 기록을 불러오는 중입니다.</p>
        <button id="retry" hidden>다시 확인</button>
      </div>
    </section>
  </main>
</body>
</html>
