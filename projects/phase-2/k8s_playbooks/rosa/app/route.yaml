apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: backend
  namespace: app
  labels:
    app: backend
spec:
  to:
    kind: Service
    name: backend
    weight: 100
  port:
    targetPort: 3000
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
