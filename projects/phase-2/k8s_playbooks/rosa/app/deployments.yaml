apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: app
spec:
  progressDeadlineSeconds: 600
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: backend
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - env:
        - name: PORT
          value: '3000'
        - name: REDIS_SENTINELS
          value: redis-sentinel.data:26379
        - name: REDIS_SENTINEL_MASTER
          value: ticketing-master
        - name: PG_HOST
          value: 10.1.93.114
        - name: PG_PORT
          value: '5432'
        - name: PG_DATABASE
          value: ticketing
        - name: SKIP_KAFKA_CONSUMERS
          value: 'false'
        - name: KAFKA_BROKERS
          value: 10.1.93.110:32089
        - name: KAFKA_CLIENT_ID
          value: ticketing-backend
        - name: KAFKA_CONSUMER_GROUP
          value: ticketing-backend-consumers
        envFrom:
        - secretRef:
            name: backend-secret
        image: ghcr.io/jisoo9123/ticketing-api:sha-2ecea669e688
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health/live
            port: http
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        name: backend
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health/ready
            port: http
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      dnsPolicy: ClusterFirst
      imagePullSecrets:
      - name: ghcr-pull-secret
      restartPolicy: Always
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
---
