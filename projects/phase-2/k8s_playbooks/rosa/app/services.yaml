apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: app
  labels:
    app: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
  - protocol: TCP
    port: 3000
    targetPort: 3000
    name: http
---
apiVersion: v1
kind: Service
metadata:
  name: mock-notification
  namespace: app
  labels:
    app.kubernetes.io/name: mock-notification
    app.kubernetes.io/part-of: ticketing-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mock-notification
  ports:
  - protocol: TCP
    port: 8081
    targetPort: http
    name: http
---
apiVersion: v1
kind: Service
metadata:
  name: mock-payment
  namespace: app
  labels:
    app.kubernetes.io/name: mock-payment
    app.kubernetes.io/part-of: ticketing-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mock-payment
  ports:
  - protocol: TCP
    port: 8080
    targetPort: http
    name: http
