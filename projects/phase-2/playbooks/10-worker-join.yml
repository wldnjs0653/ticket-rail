---
- name: Prepare Kubernetes worker join information
  hosts: master1
  become: true
  gather_facts: false

  tasks:

    - name: Generate worker join command
      ansible.builtin.command:
        cmd: kubeadm token create --print-join-command
      register: worker_join_result
      changed_when: false

    - name: Save worker join command
      ansible.builtin.set_fact:
        worker_join_command: "{{ worker_join_result.stdout }}"


- name: Join worker nodes
  hosts: workers
  become: true
  gather_facts: false

  tasks:

    - name: Check whether Kubernetes is already joined
      ansible.builtin.stat:
        path: /etc/kubernetes/kubelet.conf
      register: kubelet_config

    - name: Join worker node
      ansible.builtin.command:
        cmd: "{{ hostvars['master1']['worker_join_command'] }}"
      when: not kubelet_config.stat.exists
