---
- name: Join Kubernetes data workers
  hosts: data_workers
  become: true
  gather_facts: true

  vars:
    kubernetes_api_endpoint: "10.1.93.65:6443"

    kubernetes_node_name_map:
      worker4: w4
      worker5: w5
      worker6: w6

    kubernetes_node_name: "{{ kubernetes_node_name_map[inventory_hostname] }}"
  tasks:

    - name: Check whether data worker is already registered
      ansible.builtin.command:
        cmd: "kubectl get node {{ kubernetes_node_name }}"
      delegate_to: master1
      register: node_registration
      changed_when: false
      failed_when: false

    - name: Show current registration status
      ansible.builtin.debug:
        msg: >-
          {{ kubernetes_node_name }} is already registered in the current
          Kubernetes cluster. Skipping kubeadm join.
      when: node_registration.rc == 0

    - name: Check for existing kubelet configuration
      ansible.builtin.stat:
        path: /etc/kubernetes/kubelet.conf
      register: kubelet_config
      when: node_registration.rc != 0

    - name: Stop when stale Kubernetes configuration exists
      ansible.builtin.fail:
        msg: >-
          {{ inventory_hostname }} is not registered in the current Kubernetes
          cluster, but /etc/kubernetes/kubelet.conf already exists.
          This may be a stale configuration from another Kubernetes cluster.
          Automatic reset or deletion is intentionally disabled.
          Back up and clean the old Kubernetes configuration first,
          then run this playbook again.
      when:
        - node_registration.rc != 0
        - kubelet_config.stat.exists

    - name: Generate kubeadm join command on master1
      ansible.builtin.command:
        cmd: kubeadm token create --print-join-command
      delegate_to: master1
      register: data_worker_join_command
      changed_when: false
      when:
        - node_registration.rc != 0
        - not kubelet_config.stat.exists

    - name: Join data worker to Kubernetes cluster
      ansible.builtin.command:
        cmd: "{{ data_worker_join_command.stdout }} --node-name {{ kubernetes_node_name }}"
      register: kubeadm_join_result
      when:
        - node_registration.rc != 0
        - not kubelet_config.stat.exists

    - name: Show kubeadm join result
      ansible.builtin.debug:
        msg: "{{ kubeadm_join_result.stdout_lines | default([]) }}"
      when:
        - kubeadm_join_result is defined
        - kubeadm_join_result.changed | default(false)

    - name: Wait for data worker to register
      ansible.builtin.command:
        cmd: "kubectl get node {{ kubernetes_node_name }}"
      delegate_to: master1
      register: joined_node
      changed_when: false
      retries: 12
      delay: 5
      until: joined_node.rc == 0
      when:
        - node_registration.rc != 0
        - not kubelet_config.stat.exists

    - name: Show registered data worker
      ansible.builtin.command:
        cmd: "kubectl get node {{ kubernetes_node_name }} -o wide"
      delegate_to: master1
      register: data_worker_node
      changed_when: false
      when:
        - node_registration.rc != 0
        - not kubelet_config.stat.exists

    - name: Display registered data worker
      ansible.builtin.debug:
        var: data_worker_node.stdout_lines
      when:
        - data_worker_node is defined
