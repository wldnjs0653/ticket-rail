---
- name: Initialize Kubernetes Cluster
  hosts: master1
  become: true
  gather_facts: true

  tasks:

    - name: Check whether Kubernetes is already initialized
      ansible.builtin.stat:
        path: /etc/kubernetes/admin.conf
      register: kubeadm_initialized

    - name: Initialize Kubernetes control plane
      ansible.builtin.command:
        cmd: >
          kubeadm init
          --control-plane-endpoint "10.1.93.65:6443"
          --upload-certs
      when: not kubeadm_initialized.stat.exists
      register: kubeadm_init_result

    - name: Create kubeconfig directory
      ansible.builtin.file:
        path: /root/.kube
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Copy admin kubeconfig
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: /root/.kube/config
        remote_src: true
        owner: root
        group: root
        mode: "0600"

    - name: Check Kubernetes nodes
      ansible.builtin.command:
        cmd: kubectl get nodes
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: kubectl_nodes
      changed_when: false

    - name: Show Kubernetes nodes
      ansible.builtin.debug:
        var: kubectl_nodes.stdout_lines
